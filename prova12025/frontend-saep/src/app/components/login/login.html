<div class="login-card">
    <h3 class="titulo">Sistema Almoxarifado</h3>
    <!-- ngSubmit => função do angular que permite rodar um método ao enviar o formulário -->
    <form (ngSubmit)="entrar()" #loginForm="ngForm">
        <!-- ngform => associa elementos do formulário a elementos do typescript -->
        <label>Login</label>
        <input type="text" name="login" [(NgModel)]="credenciais.login" required>
        <label>Senha</label>
        <input type="password" name="senha" [(NgModel)]="credenciais.senha" required>
        <button type="submit" [disabled]="loginForm.invalid">Entrar</button>
    </form>
</div>
