<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Editar Tutor</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f4f7f6; }
        .box { background: white; padding: 20px; border-radius: 8px; max-width: 400px; }
        input { width: 100%; padding: 8px; margin: 8px 0; box-sizing: border-box; }
        button { padding: 10px 15px; background: #28a745; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <a href="{{ url_for('tutores') }}">← Cancelar e Voltar</a>
    <div class="box">
        <h2>Editar Tutor #{{ tutor.id_tutor }}</h2>
        <form method="POST">
            <label>Nome:</label>
            <input type="text" name="nome" value="{{ tutor.nome }}" required>
            <label>CPF:</label>
            <input type="text" name="cpf" value="{{ tutor.cpf_visivel }}" required>
            <label>Telefone:</label>
            <input type="text" name="telefone" value="{{ tutor.telefone }}" required>
            <label>E-mail:</label>
            <input type="email" name="email" value="{{ tutor.email }}" required>
            <label>Nova Senha (deixe em branco para manter a atual):</label>
            <input type="password" name="senha" placeholder="Nova senha opcional">
            <button type="submit">Salvar Alterações</button>
        </form>
    </div>
</body>
</html>
