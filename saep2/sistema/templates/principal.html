<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Painel Principal - Clínica Veterinária</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f4f7f6; }
        header { background: #007bff; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        .container { padding: 30px; max-width: 800px; margin: auto; }
        .menu { display: flex; gap: 20px; margin-top: 20px; }
        .menu a { flex: 1; text-align: center; padding: 25px; background: white; text-decoration: none; color: #333; font-weight: bold; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .menu a:hover { background: #e9ecef; }
        .btn-sair { background: #dc3545; color: white; padding: 8px 15px; text-decoration: none; border-radius: 4px; }
    </style>
</head>
<body>
    <header>
        <div>Bem-vindo(a), <strong>{{ nome_usuario }}</strong></div>
        <a href="{{ url_for('logout') }}" class="btn-sair">Sair do Sistema</a>
    </header>
    <div class="container">
        <h2>Módulos do Sistema</h2>
        <div class="menu">
            <a href="{{ url_for('tutores') }}">Gerenciar Tutores</a>
            <a href="{{ url_for('pets') }}">Gerenciar Pets</a>
            <a href="{{ url_for('agendamentos') }}">Gerenciar Agendamentos</a>
        </div>
    </div>
</body>
</html>
